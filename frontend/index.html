<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Log</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Workout Log</h1>
    <p class="subtitle">Track every session. Watch the numbers climb.</p>
  </header>

  <main>
    <!-- CREATE / UPDATE form -->
    <section class="card">
      <h2 id="form-title">Log a workout</h2>
      <form id="workout-form">
        <input type="hidden" id="workout-id" />

        <div class="row">
          <label>Name
            <input type="text" id="name" placeholder="Push Day" required />
          </label>
          <label>Date
            <input type="date" id="date" required />
          </label>
          <label>Duration (min)
            <input type="number" id="duration" min="0" value="60" />
          </label>
        </div>

        <h3>Exercises</h3>
        <div class="exercise-header">
          <span>Exercise</span><span>Sets</span><span>Reps</span><span>Weight</span><span></span>
        </div>
        <div id="exercise-list"></div>
        <button type="button" id="add-exercise" class="secondary">+ Add exercise</button>

        <label>Notes
          <textarea id="notes" rows="2" placeholder="Felt strong today"></textarea>
        </label>

        <p id="form-error" class="error"></p>

        <div class="actions">
          <button type="submit" id="submit-btn">Save workout</button>
          <button type="button" id="cancel-edit" class="secondary hidden">Cancel edit</button>
        </div>
      </form>
    </section>

    <!-- Personal records -->
    <section class="card">
      <h2>Personal records</h2>
      <div id="prs"><p class="muted">No records yet.</p></div>
    </section>

    <!-- READ list -->
    <section class="card">
      <div class="list-header">
        <h2>History</h2>
        <input type="search" id="search" placeholder="Search by name..." />
      </div>
      <div id="workout-list"><p class="muted">Loading...</p></div>
    </section>
  </main>

  <template id="exercise-row-template">
    <div class="exercise-row">
      <input type="text" class="ex-name" placeholder="Bench Press" required />
      <input type="number" class="ex-sets" min="1" value="3" required />
      <input type="number" class="ex-reps" min="1" value="10" required />
      <input type="number" class="ex-weight" min="0" step="0.5" value="0" required />
      <button type="button" class="remove-ex" title="Remove">✕</button>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
