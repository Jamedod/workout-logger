spring.application.name=workout-log

# Railway provides PORT; falls back to 8080 locally
server.port=${PORT:8080}

# Set MONGODB_URI in Railway (Variables tab) to your MongoDB service's connection URL,
# e.g. ${{MongoDB.MONGO_URL}}. Locally it falls back to a local MongoDB.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/workoutlog}
# Railway's Mongo URL usually has no database name in it, so set one explicitly
spring.data.mongodb.database=${MONGODB_DATABASE:workoutlog}

# Comma-separated list of frontend URLs allowed to call the API
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
